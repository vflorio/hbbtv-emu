<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//HbbTV//1.1.1//EN" "http://www.hbbtv.org/dtd/HbbTV-1.1.1.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="application/vnd.hbbtv.xhtml+xml; charset=UTF-8" />
  <title>e2e basic app</title>
  <style type="text/css">
    body { margin: 0; width: 1280px; height: 720px; }
    #video { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  </style>
</head>
<body>
  <!-- The usual HbbTV boilerplate: OIPF objects declared in the markup... -->
  <object id="appmgr" type="application/oipfApplicationManager"></object>
  <object id="oipfcfg" type="application/oipfConfiguration"></object>
  <object id="video" type="video/broadcast"></object>

  <!-- ...and used right away by an inline script, as most applications do. -->
  <script type="text/javascript">
  //<![CDATA[
    var e2e = (window.__e2e = { initError: null, keysetValue: null, keys: [], events: [] });
    // What the application sees when it sniffs the device, as many do at start.
    e2e.userAgentAtFirstScript = navigator.userAgent;
    // And the browser's client hints, which would name the real browser (secure contexts only).
    e2e.userAgentDataAtFirstScript = "userAgentData" in navigator;
    // Whether the host's configuration was already there (synchronous bootstrap).
    e2e.configAtFirstScript = Boolean(window[Symbol.for("hbb-emu.config")]);
    try {
      var app = document.getElementById("appmgr").getOwnerApplication(document);
      // The service the application is broadcast-related to, as it reads it at start.
      var channel = app.privateData.currentChannel;
      e2e.channelAtFirstScript = channel ? channel.ccid : null;
      // RED | GREEN | YELLOW | BLUE | NAVIGATION
      app.privateData.keyset.setValue(0x1 | 0x2 | 0x4 | 0x8 | 0x10);
      app.show();
      e2e.keysetValue = app.privateData.keyset.value;
      // The broadcast, in the object's window: the application takes it from the TV.
      document.getElementById("video").bindToCurrentChannel();
      // What an application that does not declare its objects does: it asks the factory.
      var factory = window.oipfObjectFactory;
      var created = factory.createApplicationManagerObject().getOwnerApplication(document);
      e2e.factoryAtFirstScript = {
        videoBroadcast: factory.isObjectSupported("video/broadcast"),
        drmAgent: factory.isObjectSupported("application/oipfDrmAgent"),
        channel: created.privateData.currentChannel ? created.privateData.currentChannel.ccid : null,
      };
    } catch (error) {
      e2e.initError = String((error && error.message) || error);
    }
    document.addEventListener("keydown", function (event) {
      e2e.keys.push(event.keyCode);
    });
    // What a third-party script (e.g. a consent banner) does with every key: it
    // expects the target to be an element.
    ["keydown", "keypress", "keyup"].forEach(function (type) {
      document.addEventListener(type, function (event) {
        e2e.events.push({
          type: event.type,
          target: event.target.tagName.toLowerCase() + (event.target.getAttribute("id") || ""),
          key: event.key,
          keyCode: event.keyCode,
          which: event.which,
          charCode: event.charCode,
        });
      });
    });
  //]]>
  </script>
</body>
</html>

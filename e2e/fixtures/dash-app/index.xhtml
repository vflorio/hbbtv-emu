<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//HbbTV//1.1.1//EN" "http://www.hbbtv.org/dtd/HbbTV-1.1.1.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="application/vnd.hbbtv.xhtml+xml; charset=UTF-8" />
  <title>e2e HTML5 DASH app</title>
  <style type="text/css">
    body { margin: 0; width: 1280px; height: 720px; }
  </style>
  <script type="text/javascript">
  //<![CDATA[
    // Every error event of a media element or of a <source>, from the start of the document.
    window.__mediaErrors = [];
    document.addEventListener("error", function (event) {
      var target = event.target;
      if (!target || !/^(video|audio|source)$/i.test(target.nodeName)) return;
      var element = target.nodeName.toLowerCase() === "source" ? target.parentNode : target;
      window.__mediaErrors.push(
        element.id + ":" + target.nodeName.toLowerCase() + ":" + (target.error ? target.error.code : "-")
      );
    }, true);
  //]]>
  </script>
</head>
<body>
  <object id="appmgr" type="application/oipfApplicationManager"></object>
  <!-- An HbbTV 2 VOD player: the MPD is the source of an HTML5 video, set from script. -->
  <video id="video" style="position: absolute; left: 0; top: 0; width: 640px; height: 360px;"></video>
  <!-- The MPD in the markup: as the src attribute, and as the first <source>, before a 1 s audio fallback. -->
  <video id="markup" src="clip.mpd" autoplay="autoplay" muted="muted" style="width: 160px; height: 90px;"></video>
  <video id="sourced" autoplay="autoplay" muted="muted" style="width: 160px; height: 90px;">
    <source src="clip.mpd" type="application/dash+xml" />
    <source src="../audio-app/tone.m4a" type="audio/mp4" />
  </video>
  <!-- An MPD with event streams (events.mpd): the application follows them as TextTracks. -->
  <video id="events" muted="muted" style="width: 160px; height: 90px;"></video>
  <!-- An MPD with two audio languages (languages.mpd): the application lists and switches them. -->
  <video id="languages" muted="muted" style="width: 160px; height: 90px;"></video>
  <!-- An MPD with two EBU-TT-D subtitle tracks (subtitles.mpd): the application shows one. -->
  <video id="subtitles" muted="muted" style="width: 160px; height: 90px;"></video>

  <script type="text/javascript">
  //<![CDATA[
    var e2e = (window.__e2e = { initError: null, events: [], errors: [] });
    try {
      document.getElementById("appmgr").getOwnerApplication(document).show();
      var video = document.getElementById("video");
      ["loadedmetadata", "playing", "ended"].forEach(function (type) {
        video.addEventListener(type, function () {
          e2e.events.push(type);
        });
      });
      video.addEventListener("error", function () {
        e2e.errors.push(video.error && video.error.code);
      });
      e2e.canPlayDash = video.canPlayType("application/dash+xml");

      // TS 102 796 §9.3.2.2: every track of an event stream, and every cue the first time it is active.
      e2e.tracks = [];
      e2e.cues = [];
      // TS 102 796 A.2.12.1: the audio tracks' events.
      e2e.audioTrackEvents = [];
      var languages = document.getElementById("languages");
      languages.audioTracks.addEventListener("addtrack", function (event) {
        e2e.audioTrackEvents.push("addtrack " + event.track.id);
      });
      languages.audioTracks.onchange = function () {
        e2e.audioTrackEvents.push("change");
      };

      // TS 102 796 A.2.12.1: the subtitle tracks, and every cue of theirs the first time it is active.
      e2e.subtitleTracks = [];
      e2e.subtitleCues = [];
      document.getElementById("subtitles").textTracks.addEventListener("addtrack", function (event) {
        var track = event.track;
        e2e.subtitleTracks.push({ kind: track.kind, label: track.label, language: track.language, id: track.id, mode: track.mode });
        var seen = [];
        track.addEventListener("cuechange", function () {
          for (var i = 0; i < track.activeCues.length; i++) {
            var cue = track.activeCues[i];
            if (seen.indexOf(cue) >= 0) continue;
            seen.push(cue);
            e2e.subtitleCues.push({ track: track.id, startTime: cue.startTime, endTime: cue.endTime });
          }
        });
      });

      var eventsVideo = document.getElementById("events");
      eventsVideo.textTracks.addEventListener("addtrack", function (event) {
        var track = event.track;
        e2e.tracks.push({
          kind: track.kind,
          label: track.label,
          language: track.language,
          id: track.id,
          mode: track.mode,
          dispatchType: track.inBandMetadataTrackDispatchType
        });
        var seen = {};
        track.addEventListener("cuechange", function () {
          for (var i = 0; i < track.activeCues.length; i++) {
            var cue = track.activeCues[i];
            if (seen[cue.id]) continue;
            seen[cue.id] = true;
            e2e.cues.push({
              id: cue.id,
              startTime: cue.startTime,
              endTime: cue.endTime,
              isDataCue: cue instanceof window.DataCue,
              data: new TextDecoder().decode(cue.data)
            });
          }
        });
      });
    } catch (error) {
      e2e.initError = String((error && error.message) || error);
    }
  //]]>
  </script>
</body>
</html>
